    <style>
      .legacy-browser-message {
        display: none;
        padding: 24px;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .no-esm .legacy-browser-message {
        display: block;
      }
    </style>
    <script>
      ;(function () {
        var root = document.documentElement
        var css = window.CSS
        var supportsModernColor =
          !!css &&
          css.supports('color', 'oklch(0.5 0.1 120)') &&
          css.supports('color', 'color-mix(in srgb, red 50%, white)')
        if (!supportsModernColor) root.classList.add('legacy-webkit')
        if (!('noModule' in document.createElement('script'))) root.classList.add('no-esm')

        var mode = localStorage.getItem('theme_mode')
        var isDark = mode === 'dark'
        if (mode === 'light') isDark = false
        if (mode !== 'dark' && mode !== 'light' && mode !== 'beijing') {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        }
        if (mode === 'beijing') {
          var hour = new Date().getHours()
          isDark = hour < 7 || hour >= 19
        }
        root.classList.toggle('dark', isDark)
        root.style.colorScheme = isDark ? 'dark' : 'light'
      })()
    </script>
